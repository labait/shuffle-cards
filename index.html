<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shuffle Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  </head>
  <body class="min-h-screen">
    <main class="mx-auto flex min-h-screen max-w-2xl flex-col items-center justify-center px-6 py-12">
      <div id="deck" class="relative h-[300px] w-[180px] perspective-[1000px]"></div>
    </main>

    <button
      id="shuffle"
      type="button"
      class="fixed bottom-20 left-1/2 z-50 -translate-x-1/2 rounded-lg bg-gray-900 px-5 py-2.5 text-sm font-medium text-white shadow-lg transition hover:bg-gray-700"
    >
      Shuffle
    </button>

    <div id="card-template" class="hidden" aria-hidden="true">
      <div class="card absolute h-full w-full cursor-pointer select-none">
        <div class="card-tilt size-full [transform-style:preserve-3d]">
          <div
            class="card-flip relative size-full rounded-[10px] shadow-md outline outline-1 outline-gray-300 [transform-style:preserve-3d] transition-[transform,box-shadow] duration-250 ease-in-out"
          >
            <div
              class="card-face card-front absolute inset-0 overflow-hidden rounded-[10px] backface-hidden [transform:rotateY(0deg)_translateZ(1px)]"
            >
              <img
                class="pointer-events-none block size-full object-cover"
                src="images/card-front.png"
                alt="Fronte carta"
                draggable="false"
              />
              <span class="number pointer-events-none absolute inset-0 flex items-center justify-center text-8xl font-bold text-gray-800"></span>
            </div>
            <div
              class="card-face card-back absolute inset-0 overflow-hidden rounded-[10px] backface-hidden [transform:rotateY(180deg)_translateZ(1px)]"
            >
              <img class="pointer-events-none block size-full object-cover" src="" alt="Retro carta" draggable="false" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const items = []
      const backs = ['card-back-red.png', 'card-back-black.png']

      Array.from({ length: 12 }).forEach((_, index) => {
        items.push({
          image_back: backs[index % backs.length],
        })
      })

      let cardCurrentIndex = null
      let topCardIndex = null
      let topZIndex = 0
      const cards = []

      const setCardTransform = ({ tilt, flip, rotation, faceUp }) => {
        tilt.style.transform = `rotate(${rotation}deg)`
        flip.style.transform = `rotateY(${faceUp ? 0 : 180}deg)`
      }

      const setCardPosition = (cardState, x, y, rotation) => {
        cardState.element.style.left = `${x}px`
        cardState.element.style.top = `${y}px`
        cardState.rotation = rotation
        setCardTransform(cardState)
      }

      const readInitPosition = (card) => ({
        x: parseFloat(card.dataset.initX),
        y: parseFloat(card.dataset.initY),
        rotation: parseFloat(card.dataset.rotation),
      })

      const animateCard = (cardState, { x, y, rotation, speed }) =>
        new Promise((resolve) => {
          gsap
            .timeline({
              defaults: { duration: speed / 1000, ease: 'power2.inOut' },
              onComplete: () => {
                cardState.rotation = rotation
                resolve()
              },
            })
            .to(cardState.element, { left: x, top: y }, 0)
            .to(cardState.tilt, { rotation }, 0)
        })

      const deckShuffle = async (position = 'top') => {
        const offsetX = 24
        const offsetY = 48
        const offsetRotation = 45
        const speed = 70

        const deck = document.querySelector('#deck')
        if (!deck || cards.length === 0) return

        if (cardCurrentIndex !== null) {
          const index = cardCurrentIndex
          cards[index].faceUp = false
          setCardTransform(cards[index])
          cardCurrentIndex = null
          await new Promise((resolve) => setTimeout(resolve, 250))
        }

        const cardWidth = deck.offsetWidth
        const cardHeight = deck.offsetHeight
        const centerX = cardWidth / 2
        const centerY = cardHeight / 2
        const order = [...cards.keys()].sort(() => Math.random() - 0.5)

        for (const index of order) {
          const cardState = cards[index]

          const side = Math.random() < 0.5 ? -1 : 1
          const distance = cardWidth + (Math.random() * 2 - 1) * offsetX
          const x = centerX + side * distance - cardWidth / 2
          const y = centerY - cardHeight / 2 + (Math.random() * 2 - 1) * offsetY
          const rotation = (Math.random() * 2 - 1) * offsetRotation

          await animateCard(cardState, { x, y, rotation, speed })

          const zIndex =
            position === 'top'
              ? ++topZIndex
              : Math.floor(Math.random() * (cards.length + 1))
          cardState.element.style.zIndex = String(zIndex)

          const init = readInitPosition(cardState.element)
          await animateCard(cardState, { x: init.x, y: init.y, rotation: init.rotation, speed })
        }

        topZIndex = Math.max(...cards.map(({ element }) => Number(element.style.zIndex)))
        const topIndex = cards.findIndex(
          ({ element }) => Number(element.style.zIndex) === topZIndex
        )
        setTopCard(topIndex)
      }

      const setCardShadow = (flip, isTop) => {
        flip.classList.toggle('shadow-md', !isTop)
        flip.classList.toggle('shadow-2xl', isTop)
      }

      const setTopCard = (index) => {
        if (topCardIndex !== null) {
          setCardShadow(cards[topCardIndex].flip, false)
        }

        topCardIndex = index
        setCardShadow(cards[topCardIndex].flip, true)
      }

      const cardFlip = (index) => {
        if (cardCurrentIndex !== null && cardCurrentIndex !== index) {
          cards[cardCurrentIndex].faceUp = false
          setCardTransform(cards[cardCurrentIndex])
        }

        cards[index].faceUp = true
        cardCurrentIndex = index

        topZIndex += 1
        cards[index].element.style.zIndex = String(topZIndex)
        setCardTransform(cards[index])
        setTopCard(index)
      }

      const deckCreate = (containerSelector) => {
        const maxOffset = 60
        const maxRotation = 30

        const container = document.querySelector(containerSelector)
        const template = document.querySelector('#card-template .card')
        if (!container || !template) return

        container.replaceChildren()
        cards.length = 0
        cardCurrentIndex = null
        topCardIndex = null
        topZIndex = items.length

        items.forEach((item, index) => {
          const card = template.cloneNode(true)
          const tilt = card.querySelector('.card-tilt')
          const flip = card.querySelector('.card-flip')
          const number = card.querySelector('.number')
          const back = card.querySelector('.card-back img')
          const initX = (Math.random() * 2 - 1) * maxOffset
          const initY = (Math.random() * 2 - 1) * maxOffset
          const initRotation = (Math.random() * 2 - 1) * maxRotation

          card.dataset.index = String(index)
          card.dataset.initX = String(initX)
          card.dataset.initY = String(initY)
          card.dataset.rotation = String(initRotation)
          card.style.left = `${initX}px`
          card.style.top = `${initY}px`
          card.style.zIndex = String(index + 1)
          number.textContent = String(index + 1)
          back.src = `images/${item.image_back}`

          cards[index] = { element: card, tilt, flip, rotation: initRotation, faceUp: false }
          setCardTransform(cards[index])

          card.addEventListener('dragstart', (event) => event.preventDefault())
          card.addEventListener('click', () => cardFlip(index))

          container.append(card)
        })

        setTopCard(items.length - 1)
      }

      deckCreate('#deck')

      document.querySelector('#shuffle').addEventListener('click', async () => {
        const button = document.querySelector('#shuffle')
        button.disabled = true
        await deckShuffle()
        button.disabled = false
      })
    </script>
  </body>
</html>
